<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Lightning bolt (represents speed/automation) -->
  <path d="M72 28L48 68h16L56 100l28-44H68L72 28z" 
        fill="url(#boltGrad)" 
        stroke="#fff" 
        stroke-width="2"
        stroke-linejoin="round"/>
  
  <!-- Subtle shine effect -->
  <rect x="8" y="8" width="112" height="56" rx="24" fill="white" opacity="0.08"/>
</svg>
